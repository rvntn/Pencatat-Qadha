name: Rust

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run workflow" secara manual di GitHub
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for Windows
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
        
    - name: Enable Rust caching
      uses: Swatinem/rust-cache@v2 # Mempercepat proses build untuk commit selanjutnya
      
    - name: Build release
      run: cargo build --release

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: QadhaTracker-Windows-exe
        path: target/release/qadha_tracker.exe
